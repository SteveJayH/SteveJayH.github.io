name: Website preview checks
on:
  pull_request:
    branches: [main]
    paths: ['index.html', 'publications.html', 'assets/**', 'tests/**', '.github/workflows/website-preview.yml']
permissions:
  contents: read
concurrency:
  group: website-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Check pages and capture screenshots
        run: |
          python -m http.server 8000 >/tmp/site-server.log 2>&1 &
          python tests/website_preview.py
      - name: Package website and screenshots
        uses: actions/upload-artifact@v4
        with:
          name: seungjae-han-rajan-revision
          retention-days: 14
          path: |
            index.html
            publications.html
            assets/
            photo.jpeg
            nature_methods_cover.png
            CV_SeungjaeHan_0707.pdf
            REDESIGN.md
            tests/
            previews/
