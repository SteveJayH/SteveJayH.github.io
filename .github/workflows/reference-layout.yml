name: Reference layout review
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/reference-layout.yml']
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Capture reference layout and computed styles
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from playwright.sync_api import sync_playwright
          out=Path('reference-review');out.mkdir()
          with sync_playwright() as p:
              b=p.chromium.launch()
              page=b.new_page(viewport={'width':1440,'height':1000},device_scale_factor=1)
              page.goto('https://www.rajanlab.com/kanaka-rajan',wait_until='networkidle')
              page.evaluate('document.fonts.ready')
              page.wait_for_timeout(1500)
              (out/'reference.html').write_text(page.content())
              page.screenshot(path=str(out/'reference-desktop.png'),full_page=True)
              page.screenshot(path=str(out/'reference-first.png'))
              styles=page.evaluate('''() => [...document.querySelectorAll('body *')].filter(e=>!['SCRIPT','STYLE','NOSCRIPT','PATH'].includes(e.tagName)).map(e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);let props={};for(const k of ['fontFamily','fontSize','fontWeight','lineHeight','letterSpacing','textTransform','color','backgroundColor','borderColor','borderWidth','borderRadius','margin','padding','display','position','gridTemplateColumns','gap','alignItems','justifyContent','maxWidth','width','height','objectFit'])props[k]=s[k];return {tag:e.tagName,classes:e.className,text:e.children.length?'':e.textContent.trim().slice(0,200),x:r.x,y:r.y,w:r.width,h:r.height,styles:props};})''')
              (out/'computed-desktop.json').write_text(json.dumps(styles,indent=2))
              for i,url in enumerate(page.locator('link[rel="stylesheet"]').evaluate_all('(els)=>els.map(e=>e.href)')):
                  response=page.request.get(url)
                  (out/f'styles-{i}.css').write_text(response.text())
              page.set_viewport_size({'width':390,'height':844})
              page.reload(wait_until='networkidle')
              page.evaluate('document.fonts.ready')
              page.wait_for_timeout(1000)
              page.screenshot(path=str(out/'reference-mobile.png'),full_page=True)
              b.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reference-layout-review
          path: reference-review/
          retention-days: 1
