name: Assemble full lab website
on:
  pull_request:
    paths: ['.github/lab-transfer/**', '.github/workflows/apply-lab-revision.yml']
permissions:
  contents: write
concurrency:
  group: apply-lab-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  assemble:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'redesign/rajan-inspired-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore the authored site source
        run: |
          python - <<'PY'
          import hashlib, json, lzma
          from pathlib import Path
          raw = b''.join(Path(f'.github/lab-transfer/part-{i}.bin').read_bytes() for i in range(4))
          assert hashlib.sha256(raw).hexdigest() == '700748c3d17815b9e28fc74fb117062a5a298e2a6ab348c5d386c3e1eb0268a1'
          files = json.loads(lzma.decompress(raw))
          allowed = {'tools/build_lab.py', 'tools/build_preview.py', 'assets/lab.css', 'assets/lab.js', 'tests/lab_test.py', 'LAB-SITE.md', '.github/workflows/website-preview.yml'}
          assert set(files) == allowed
          for name, content in files.items():
              path = Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8')
          PY
      - name: Install browser tools
        run: |
          pip install beautifulsoup4 playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Build the full static site and portable preview
        run: |
          python - <<'PY'
          import urllib.request
          from pathlib import Path
          Path('assets').mkdir(exist_ok=True)
          url = 'https://media.springernature.com/full/springer-static/image/art%3A10.1038%2Fs41592-023-02005-8/MediaObjects/41592_2023_2005_Fig1_HTML.png'
          urllib.request.urlretrieve(url, 'assets/support-figure.png')
          PY
          python tools/build_lab.py
          python tools/build_preview.py
      - name: Check all pages, preview navigation, content and fonts
        run: |
          python -m http.server 8000 >/tmp/site-server.log 2>&1 &
          python tests/lab_test.py
      - name: Remove superseded checks and temporary transfer files
        run: |
          rm -rf .github/lab-transfer
          rm -f .github/workflows/apply-lab-revision.yml
          rm -f tests/font_check.py tests/website_preview.py
          printf '# Full lab website\n\nThe current design and editing notes are in [LAB-SITE.md](LAB-SITE.md).\n' > REDESIGN.md
      - name: Package the site and real browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: han-lab-full-website
          retention-days: 14
          path: |
            *.html
            assets/
            data/
            tools/
            tests/lab_test.py
            photo.jpeg
            nature_methods_cover.png
            CV_SeungjaeHan_0707.pdf
            LAB-SITE.md
            REDESIGN.md
            previews/
      - name: Save tested pages to the review branch only
        env:
          REVIEW_BRANCH: ${{ github.head_ref }}
        run: |
          test "$REVIEW_BRANCH" = 'redesign/rajan-inspired-20260918'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- *.html assets data tools tests .github LAB-SITE.md REDESIGN.md
          git commit -m 'Build full lab site with Our Science, People, Press, Comics and linked resources'
          git push origin "HEAD:refs/heads/$REVIEW_BRANCH"
