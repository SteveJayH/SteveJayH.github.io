name: Apply blue lab palette
on:
  pull_request:
    paths: ['tools/apply_blue_palette.py', '.github/workflows/apply-blue-palette.yml']
permissions:
  contents: write
concurrency:
  group: blue-palette-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  palette:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'redesign/rajan-inspired-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          pip install beautifulsoup4 playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Apply palette and regenerate pages
        run: |
          python tools/apply_blue_palette.py
          python tools/build_lab.py
          python tools/build_preview.py
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          from bs4 import BeautifulSoup
          routes=json.loads(Path('data/routes.json').read_text())
          for name in routes:
              path=name+'.html'
              old=BeautifulSoup(subprocess.check_output(['git','show','HEAD:'+path],text=True),'html.parser')
              new=BeautifulSoup(Path(path).read_text(),'html.parser')
              assert old.body.decode_contents()==new.body.decode_contents(), path
              assert new.select_one('meta[name="theme-color"]')['content']=='#004890', path
          for file in ['assets/site.css','assets/lab.css','preview.html']:
              text=Path(file).read_text().lower()
              assert all(col not in text for col in ['#982b34','#420d5d','#42105b','#321446','#1b1464']), file
          print('All 17 page bodies and links are unchanged; old palette values are absent.')
          PY
      - name: Test all pages and capture actual browser screenshots
        run: |
          python -m http.server 8000 >/tmp/site-server.log 2>&1 &
          python tests/lab_test.py
      - name: Package blue website
        uses: actions/upload-artifact@v4
        with:
          name: han-lab-blue-website
          retention-days: 14
          path: |
            *.html
            assets/
            data/
            tools/
            tests/
            photo.jpeg
            nature_methods_cover.png
            CV_SeungjaeHan_0707.pdf
            LAB-SITE.md
            previews/
      - name: Commit verified palette to review branch only
        env:
          REVIEW_BRANCH: ${{ github.head_ref }}
        run: |
          test "$REVIEW_BRANCH" = 'redesign/rajan-inspired-20260918'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' assets/site.css assets/lab.css tools/build_lab.py LAB-SITE.md
          git diff --cached --quiet || git commit -m 'Apply school-blue palette #004890 and #017CC2 across the full lab site'
          git push origin "HEAD:refs/heads/$REVIEW_BRANCH"
