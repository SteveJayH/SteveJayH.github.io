name: Complete website revision
on:
  pull_request:
    branches: [main]
    paths: ['tools/complete_site.py', 'tools/site-additions.css', '.github/workflows/complete-site.yml']
permissions:
  contents: write
jobs:
  assemble:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'redesign/rajan-inspired-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser tools
        run: |
          pip install beautifulsoup4 playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Generate complete static site and review bundle
        run: |
          python tools/complete_site.py
          python tools/build_preview.py
      - name: Test every route and actual font rendering
        run: |
          python -m http.server 8000 >/tmp/site-server.log 2>&1 &
          python tests/website_preview.py
          python tests/font_check.py
      - name: Package tested website
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seungjae-han-complete-site
          retention-days: 14
          path: |
            index.html
            vision.html
            research.html
            profile.html
            publications.html
            resources.html
            news.html
            contact.html
            preview.html
            assets/
            photo.jpeg
            nature_methods_cover.png
            CV_SeungjaeHan_0707.pdf
            REDESIGN.md
            tools/build_preview.py
            tests/
            previews/
      - name: Save verified static pages to this review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html vision.html research.html profile.html publications.html resources.html news.html contact.html assets/site.css
          git rm tools/complete_site.py tools/site-additions.css
          git commit -m 'Complete static homepage, Vision, Research and linked secondary pages'
          git push origin HEAD:refs/heads/redesign/rajan-inspired-20260918
